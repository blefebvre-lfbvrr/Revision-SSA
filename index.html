<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>

<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Mise en page : une colonne étroite type appli mobile, un écran = une action.
   Palette : carrelage de piscine (fond), bleu de bassin (action), et le code des drapeaux de plage
   (vert / jaune / rouge) réservé à l'état des réponses et de la maîtrise. */
:root {
  --bg: #EAF0F3;
  --surface: #FFFFFF;
  --ink: #0E2A3B;
  --muted: #587384;
  --line: #CFDBE2;
  --accent: #0B5C8C;
  --accent-ink: #FFFFFF;
  --accent-soft: #D9E9F2;
  --green: #1C8A58;
  --green-bg: #DDF3E8;
  --yellow: #E3A900;
  --yellow-bg: #FFF1C2;
  --red: #CF3A2A;
  --red-bg: #FBE1DC;
  --orange: #C9590E;
  --f-display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --f-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A1A25; --surface: #12283A; --ink: #E5F0F6; --muted: #8FAABB; --line: #25445A;
    --accent: #56B6EA; --accent-ink: #062132; --accent-soft: #163B52;
    --green: #4CC38B; --green-bg: #12382A; --yellow: #F2C23D; --yellow-bg: #3A3010;
    --red: #FF7C69; --red-bg: #43211C; --orange: #FF9A55; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A1A25; --surface: #12283A; --ink: #E5F0F6; --muted: #8FAABB; --line: #25445A;
  --accent: #56B6EA; --accent-ink: #062132; --accent-soft: #163B52;
  --green: #4CC38B; --green-bg: #12382A; --yellow: #F2C23D; --yellow-bg: #3A3010;
  --red: #FF7C69; --red-bg: #43211C; --orange: #FF9A55; color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  min-height: 100%;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 640px; margin: 0 auto; padding-block: 12px 28px; }

/* Bandeau double rouge/jaune du poste de secours */
.band { display: grid; grid-template-rows: 5px 5px; border-radius: 2px; overflow: hidden; margin-bottom: 14px; }
.band i:first-child { background: var(--red); }
.band i:last-child { background: var(--yellow); }

header.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
h1 { font-family: var(--f-display); font-weight: 700; font-size: 40px; line-height: 0.95; letter-spacing: 0.02em; text-transform: uppercase; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); font-size: 13px; margin-top: 4px; }

/* Carte « Ma progression » : se met à jour seule à chaque réponse */
.pcard { background: var(--surface); border-radius: 16px; padding: 16px 18px 14px; box-shadow: 0 1px 2px rgba(14,42,59,.06), 0 6px 18px rgba(14,42,59,.08); }
.pc-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.pc-head h2 { display: flex; align-items: center; gap: 8px; margin: 0; font-size: 18px; font-weight: 600; line-height: 1.2; }
.pc-head svg { color: var(--green); flex: none; }
.pc-pct { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--orange); }
.pc-pct.ok { color: var(--green); }
.pc-track { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; margin: 12px 0 10px; }
.pc-track > i { display: block; height: 100%; background: var(--green); border-radius: 4px; }
.pc-n { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }

.stack { display: flex; flex-direction: column; gap: 12px; }
.hero {
  background: var(--accent); color: var(--accent-ink); border-radius: 14px; padding: 18px;
  display: flex; align-items: center; gap: 14px; justify-content: space-between; flex-wrap: wrap;
}
.hero h2 { font-family: var(--f-display); font-size: 26px; text-transform: uppercase; letter-spacing: 0.03em; margin: 0; line-height: 1.05; }
.hero p { margin: 4px 0 0; font-size: 14px; opacity: .92; max-width: 30ch; }
.btn-inv { background: var(--accent-ink); color: var(--accent); border: 0; border-radius: 10px; padding: 14px 22px; font-weight: 600; font-size: 17px; min-height: 48px; }
:root[data-theme="dark"] .btn-inv { color: var(--accent-ink); background: var(--ink); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn-inv { color: var(--accent-ink); background: var(--ink); } }

.resume { background: var(--yellow-bg); border: 1px solid var(--yellow); border-radius: 12px; padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.resume b { font-weight: 600; }
.btn { background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; min-height: 52px; font-weight: 600; text-align: left; display: flex; flex-direction: column; gap: 2px; }
.btn small { font-weight: 400; color: var(--muted); font-size: 13px; }
.btn:disabled { opacity: .5; cursor: default; }
.btn.small { min-height: 44px; padding: 10px 14px; flex-direction: row; align-items: center; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.label { font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 12px 0 0; }

.chrow { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.chmain { background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px; display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: center; text-align: left; min-width: 0; }
.chnum { font-family: var(--f-display); font-weight: 700; font-size: 30px; line-height: 1; width: 44px; height: 44px; display: grid; place-items: center; border: 2px solid var(--ink); border-radius: 8px; }
.chtxt { min-width: 0; }
.chtxt b { display: block; font-weight: 600; line-height: 1.2; }
.chtxt span { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 8px; }
.bar > i { display: block; height: 100%; background: var(--green); border-radius: 3px; }
.chall { background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 8px 12px; min-width: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px; color: var(--muted); }
.chall b { font-family: var(--f-display); font-size: 22px; color: var(--ink); line-height: 1; }

footer.foot { margin-top: 22px; color: var(--muted); font-size: 13px; display: flex; flex-direction: column; gap: 10px; }
.linkbtn { background: none; border: 0; padding: 8px 0; color: var(--muted); text-decoration: underline; text-align: left; min-height: 40px; }
.confirm { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* Quiz */
.qtop { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.qtop .linkbtn { text-decoration: none; font-weight: 600; color: var(--accent); padding: 8px 0; }
.count { font-family: var(--f-mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.prog { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px; margin-bottom: 16px; }
.prog i { height: 6px; border-radius: 3px; background: var(--line); }
.prog i.ok { background: var(--green); }
.prog i.ko { background: var(--red); }
.prog i.now { background: var(--accent); }
.chip { display: inline-block; font-family: var(--f-mono); font-size: 12px; background: var(--accent-soft); color: var(--ink); padding: 3px 8px; border-radius: 6px; letter-spacing: .04em; }
.question { font-weight: 600; font-size: 21px; line-height: 1.3; margin: 12px 0 16px; text-wrap: pretty; }
.opts { display: flex; flex-direction: column; gap: 10px; padding: 0; margin: 0; list-style: none; }
.opt { width: 100%; background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 12px; min-height: 56px; display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; text-align: left; }
.opt .k { font-family: var(--f-mono); font-size: 14px; width: 28px; height: 28px; border-radius: 7px; background: var(--accent-soft); display: grid; place-items: center; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; }
.opt.good { border-color: var(--green); background: var(--green-bg); }
.opt.good .k { background: var(--green); color: #fff; }
.opt.bad { border-color: var(--red); background: var(--red-bg); }
.opt.bad .k { background: var(--red); color: #fff; }
.opt.dim { opacity: .6; }
.fb { margin-top: 16px; border-radius: 12px; padding: 14px; border: 1.5px solid; }
.fb.good { background: var(--green-bg); border-color: var(--green); }
.fb.bad { background: var(--red-bg); border-color: var(--red); }
.fb h3 { display: flex; align-items: center; gap: 8px; font-family: var(--f-display); font-size: 22px; text-transform: uppercase; letter-spacing: .03em; margin: 0 0 6px; }
.fb p { margin: 0 0 8px; }
.fb .ref { font-size: 13px; color: var(--muted); }
.fb .ref .chip { margin-right: 6px; }
.flag { fill: currentColor; flex: none; }
.bottom {
  position: sticky; bottom: 0; background: var(--bg); margin-top: 16px;
  padding-top: 10px; padding-bottom: 10px; box-shadow: 0 -10px 12px -8px var(--bg);
}
.next { width: 100%; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 12px; padding: 15px; font-weight: 600; font-size: 17px; min-height: 52px; }
.hint { text-align: center; font-size: 12px; color: var(--muted); margin-top: 6px; }
@media (pointer: coarse) { .hint { display: none; } }

/* Résultat */
.score { text-align: center; padding: 22px 12px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; }
.score .big { font-family: var(--f-display); font-weight: 700; font-size: 72px; line-height: 1; font-variant-numeric: tabular-nums; }
.score .verdict { display: inline-flex; align-items: center; gap: 8px; font-family: var(--f-display); font-size: 24px; text-transform: uppercase; letter-spacing: .04em; margin-top: 6px; }
.score .v-green { color: var(--green); } .score .v-yellow { color: var(--yellow); } .score .v-red { color: var(--red); }
.score p { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
.miss { background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.miss .q { font-weight: 600; margin: 6px 0 6px; }
.miss .a { color: var(--green); font-weight: 500; margin: 0 0 4px; }
.miss .e { font-size: 14px; color: var(--muted); margin: 0; }
.empty { color: var(--muted); text-align: center; padding: 8px; }
@media (max-width: 380px) { h1 { font-size: 34px; } .question { font-size: 19px; } .grid2 { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: no-preference) { .opt, .btn, .next { transition: border-color .12s, background-color .12s; } }

footer.foot .warn { color: var(--red); }
</style>
</head>

<script>
// [chapitre, fiche, question, BONNE réponse, faux 1, faux 2, faux 3, explication]
const RAW = [
// ───────── Chapitre 1 : Situer son rôle et sa mission
[1,"01AC01","Quels sont les trois milieux dans lesquels la fonction de SSA peut s'exercer ?","Artificiel, littoral et eaux intérieures","Piscine, mer et montagne","Artificiel, maritime et souterrain","Public, privé et associatif","Milieu artificiel (piscine, bassins flottants aménagés), littoral (plages aménagées et surveillées) et eaux intérieures (plan d'eau, lac, rivière)."],
[1,"01AC01","Quel article du Code du sport définit les établissements de baignade d'accès payant, cible essentielle de la formation SSA ?","D322-12","D322-13","A322-8","L322-1","L'article D322-12 vise les accès payants. L'article D322-13 concerne les baignades ouvertes gratuitement au public (objectif supplémentaire de la formation)."],
[1,"01AC01","Quelle qualification de secourisme faut-il pour entrer en formation SSA Littoral ou Eaux intérieures ?","Le PSE2 (ou équivalent)","Le PSC1","Le PSE1 seul","Le SST","Il faut aussi un certificat médical valide et l'un des diplômes MNS, BNSSA ou SSA (ou une formation en cours pour l'un d'eux)."],
[1, "01AC01", "Un candidat dont la formation PSE2 est encore en cours peut-il suivre une formation SSA Littoral ou Eaux intérieures ?", "Oui, mais le certificat n'est délivré qu'une fois toutes les conditions réunies (PSE2 + MNS ou SSA)", "Non, le PSE2 doit impérativement être obtenu avant toute inscription à la formation", "Oui, et le certificat est délivré dès la fin de la formation, sans autre condition", "Non, cette formation complémentaire est strictement réservée aux seuls maîtres-nageurs", "Les candidats avec PSE2 ou SSA/MNS en cours sont acceptés, mais le certificat de compétences attend l'ensemble des conditions."],
[1, "01AC01", "Saint-Julien-en-Born (Dax, 2012) : pourquoi la commune est-elle considérée comme principale entité fautive ?", "Elle n'avait pas vérifié la compétence des sauveteurs (défaut de formation d'adaptation à l'emploi)", "Elle avait interdit aux sauveteurs d'utiliser le matériel de sauvetage disponible sur la plage", "Elle avait recruté un nombre excessif de sauveteurs sans coordination entre eux", "Elle n'avait déposé aucun plan d'organisation de la surveillance en préfecture", "La commune a failli à son obligation de surveillance efficace de la zone de baignade et n'a pas contrôlé la compétence des sauveteurs."],
[1,"01AC01","Quel matériel de sauvetage est spécifique au milieu naturel ?","Le Paddle Rescue et le filin","La bouée tube","Le plan dur","La perche","La formation en milieu naturel apprend à maîtriser du matériel dont le SSA n'a pas l'usage en milieu artificiel."],

[1,"01AC02","La responsabilité civile du SSA repose sur trois éléments. Lesquels ?","Une faute, un dommage et un lien de causalité","Une faute, une peine et une amende","Un danger, une victime et un témoin","Une intention, un dommage et un jugement","Faute (inattention, manquement, intervention inadaptée), dommage (blessure, noyade…) et lien de causalité entre les deux."],
[1,"01AC02","Quel est l'objectif de la responsabilité civile ?","Réparer le dommage subi par la victime","Punir l'auteur de la faute","Protéger la société","Sanctionner disciplinairement l'agent","La responsabilité civile répare, elle ne punit pas. C'est la responsabilité pénale qui sanctionne."],
[1,"01AC02","La responsabilité pénale d'un SSA peut-elle être transférée à son employeur ?","Non, elle est toujours personnelle","Oui, s'il est salarié","Oui, si l'employeur est une commune","Oui, si le SSA est assuré","Elle est toujours personnelle. L'employeur ne peut pas « protéger » un SSA qui commet une infraction grave et se porte le plus souvent partie civile."],
[1,"01AC02","Peine encourue pour homicide involontaire par faute simple ?","3 ans d'emprisonnement et 45 000 € d'amende","2 ans et 30 000 €","5 ans et 75 000 €","1 an et 15 000 €","Faute simple : 3 ans et 45 000 €. Violation manifestement délibérée d'une obligation particulière de sécurité : 5 ans et 75 000 €."],
[1,"01AC02","Peine encourue pour homicide involontaire par violation manifestement délibérée d'une obligation particulière de sécurité ?","5 ans d'emprisonnement et 75 000 € d'amende","3 ans et 45 000 €","2 ans et 30 000 €","7 ans et 100 000 €","Exemple : non-respect volontaire d'un protocole essentiel."],
[1,"01AC02","Blessures involontaires avec ITT supérieure à 3 mois, par faute simple : quelle peine ?","2 ans d'emprisonnement et 30 000 € d'amende","3 ans et 45 000 €","1 an et 15 000 €","5 ans et 75 000 €","Pour une violation manifestement délibérée d'une obligation de sécurité : 3 ans et 45 000 €."],
[1,"01AC02","Quelle peine encourt-on pour non-assistance à personne en danger ?","5 ans d'emprisonnement et 75 000 € d'amende","1 an et 15 000 €","3 ans et 45 000 €","2 ans et 30 000 €","Si la victime est un mineur de moins de 16 ans : 7 ans d'emprisonnement et 100 000 €."],
[1,"01AC02","Quelle peine encourt-on pour mise en danger délibérée de la vie d'autrui ?","1 an d'emprisonnement et 15 000 € d'amende","5 ans et 75 000 €","3 ans et 45 000 €","6 mois et 7 500 €","Elle vise un manquement grave exposant quelqu'un à un risque immédiat de mort ou de blessures graves."],
[1, "01AC02", "Piscine de la Pointe Rouge (2011) : quel comportement des surveillants a été mis en évidence lors de la noyade d'une fillette de 4 ans ?", "L'usage de leurs téléphones portables (SMS, connexion internet)", "L'absence totale de surveillants sur le bassin pendant toute la durée de la noyade", "Un défaut de matériel de réanimation et d'oxygénothérapie au poste de secours", "Une ouverture tardive de l'établissement au public ce jour-là", "Trois surveillants ont utilisé leur téléphone entre 17 h et 18 h 10. Jugement du 29 juin 2018 pour homicide involontaire (dysfonctionnement sécuritaire majeur)."],
[1, "01AC02", "Pourquoi une assurance professionnelle « défense et recours » est-elle indispensable au SSA ?", "La responsabilité pénale est personnelle : avocat et experts restent à sa charge", "L'employeur n'est jamais assuré, donc le SSA doit couvrir seul tous les risques", "Elle remplace le POSS et dispense l'exploitant de toute obligation de sécurité", "Elle est exigée par le Code du sport pour pouvoir s'inscrire à la formation SSA", "Sans assurance professionnelle, le SSA supporte intégralement le préjudice et les frais de justice."],
[1, "01AC02", "Qui prend en général en charge la responsabilité civile du SSA dans le cadre professionnel ?", "L'employeur (commune, structure gestionnaire, association)", "Le SSA lui-même, sur ses biens personnels dans tous les cas", "Le préfet de département, au titre de la police administrative", "La victime elle-même, au titre de l'imprudence du baigneur", "Le SSA peut toutefois être poursuivi personnellement en cas de faute intentionnelle ou d'une particulière gravité."],
[1,"01AC02","Jusqu'à quelle distance de la limite des eaux s'étend le pouvoir de police spéciale du maire sur les baignades (loi littoral de 1986) ?","300 mètres","100 mètres","500 mètres","1 mille nautique","Au-delà de la limite des eaux et jusqu'à 300 m, le maire exerce la police des baignades et des activités nautiques."],
[1, "01AC02", "Contis-Plage (1993) : quelle faute a engagé la responsabilité de la commune ?", "Une faute d'organisation de la prévention des risques (maîtres-nageurs non formés aux baïnes, baigneurs non informés)", "Un défaut d'entretien du poste de secours et du matériel de signalisation de la plage", "L'absence de drapeau vert hissé pendant la baignade des victimes", "Un effectif de sauveteurs insuffisant pour surveiller toute la zone de baignade", "La zone de baignade avait été déplacée près d'une baïne dangereuse par méconnaissance des courants d'arrachement."],
[1,"01AC02","Quel document l'employeur doit-il établir pour évaluer les risques professionnels de ses agents ?","Le DUERP","Le POSS","La main courante","Le carnet sanitaire","Document unique d'évaluation des risques professionnels, obligation du Code du travail."],
[1,"01AC02","Laquelle de ces obligations incombe au SSA (et non à l'employeur) selon le Code du travail ?","Porter une tenue adaptée et identifiable","Fournir du matériel de secours opérationnel","Former les agents aux gestes de secours","Évaluer les risques dans le DUERP","Le SSA respecte aussi les consignes, utilise le matériel fourni, signale tout danger et ne se comporte pas de manière dangereuse."],
